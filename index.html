<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12141c">
<meta name="description" content="WALLY RPG — a cel-shaded island city, an elephant in sunglasses, and sixty-nine things worth owning.">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%23141414"/><path d="M10 38 h7 l8-11 h7" fill="none" stroke="%23fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 38 h7 l8-11 h7" fill="none" stroke="%23fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>'>
<link rel="apple-touch-icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%23141414"/><path d="M10 38 h7 l8-11 h7" fill="none" stroke="%23fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 38 h7 l8-11 h7" fill="none" stroke="%23fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>'>
<title>WALLY RPG</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0d16}
  body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#f3eee5}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* ui layers are stacked above the canvas; each owns its own root */
  #ui{position:fixed;inset:0;pointer-events:none;z-index:10}
  #overlay{position:fixed;inset:0;pointer-events:none;z-index:20}

  #boot{
    position:fixed;inset:0;z-index:100;display:grid;place-items:center;
    background:#0a0d16;transition:opacity .5s ease;
  }
  #boot.gone{opacity:0;pointer-events:none}
  #bootInner{text-align:center}
  #bootMark{
    font:700 clamp(30px,7vw,64px)/1 'Baloo 2',system-ui,sans-serif;
    letter-spacing:.14em;color:#f5913c;
    text-shadow:0 0 44px rgba(245,145,60,.45);
  }
  /* DETERMINATE progress. The old bar was an indeterminate sweep, which
     said nothing — and boot is ~13 s, most of it in one stage, so "it is
     doing something" is not enough information. main.js drives #bootFill
     from measured per-stage weights. */
  #bootBar{
    margin:20px auto 0;width:240px;height:3px;border-radius:3px;
    background:rgba(255,255,255,.09);overflow:hidden;
    box-shadow:0 0 0 1px rgba(255,255,255,.04);
  }
  #bootFill{
    display:block;height:100%;width:0;border-radius:3px;
    background:linear-gradient(90deg,#d97a26,#f5913c 60%,#ffb567);
    box-shadow:0 0 12px rgba(245,145,60,.55);
    /* eased so the bar glides between stage boundaries instead of
       snapping; the duration is longer than a frame so a burst of quick
       stages still reads as motion */
    transition:width .45s cubic-bezier(.32,.72,.3,1);
    position:relative;
  }
  /* a travelling highlight, so a long stage still looks alive while the
     width is momentarily static */
  #bootFill::after{
    content:'';position:absolute;inset:0;border-radius:3px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
    animation:shimmer 1.4s ease-in-out infinite;
  }
  #bootStatus{
    margin-top:14px;display:flex;gap:12px;justify-content:center;
    align-items:baseline;width:240px;margin-left:auto;margin-right:auto;
    font:500 11px/1 ui-monospace,Menlo,monospace;
    letter-spacing:.28em;text-transform:uppercase;color:#5d6580;
  }
  #bootStage{flex:1;text-align:left;overflow:hidden;white-space:nowrap}
  #bootPct{color:#f5913c;font-variant-numeric:tabular-nums;letter-spacing:.1em}
  @keyframes shimmer{
    from{transform:translateX(-100%)}
    to{transform:translateX(100%)}
  }
  @media (prefers-reduced-motion:reduce){
    #bootFill::after{animation:none;opacity:0}
    #bootFill{transition:none}
  }
</style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="ui"></div>
  <div id="overlay"></div>

  <div id="boot">
    <div id="bootInner">
      <div id="bootMark">WALLY</div>
      <div id="bootBar"><i id="bootFill"></i></div>
      <div id="bootStatus"><span id="bootStage">starting</span><span id="bootPct">0%</span></div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
