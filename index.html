<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12141c">
<meta name="description" content="WALLY RPG — a cel-shaded island city, an elephant in sunglasses, and sixty-nine things worth owning.">
<meta name="application-name" content="WALLY RPG">
<meta name="apple-mobile-web-app-title" content="WALLY RPG">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%23141414"/><path d="M10 38 h7 l8-11 h7" fill="none" stroke="%23fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 38 h7 l8-11 h7" fill="none" stroke="%23fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>'>
<link rel="apple-touch-icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%23141414"/><path d="M10 38 h7 l8-11 h7" fill="none" stroke="%23fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 38 h7 l8-11 h7" fill="none" stroke="%23fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>'>
<title>WALLY RPG</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0d16}
  body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#f3eee5}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* ui layers are stacked above the canvas; each owns its own root */
  #ui{position:fixed;inset:0;pointer-events:none;z-index:10}
  #overlay{position:fixed;inset:0;pointer-events:none;z-index:20}

  #boot{
    position:fixed;inset:0;z-index:100;display:grid;place-items:center;
    background:#0a0d16;transition:opacity .5s ease;
  }
  #boot.gone{opacity:0;pointer-events:none}
  #bootInner{text-align:center}

  /* THE MARK. Not type — the WALLY RPG lockup, drawn as outlines by
     src/intro/titlecard.js and inlined here verbatim (prefix 'bm', so
     its masks and gradients cannot collide with the intro card's
     'ic-' ones). The game ships no font files, so a text wordmark
     would be SF Pro here and DejaVu on a CI box; the one image people
     screenshot of this game has to be the same image everywhere.
     The boot mark and the title card are therefore literally the same
     geometry, thirty seconds apart. Regenerate by calling
     wordmarkSVG({ prefix:'bm', … }) from titlecard.js. */
  #bootMark{
    width:min(78vw,420px);margin:0 auto;
    /* Two-stage glow. One wide 44px pass made a lit rounded BOX, not a
       lit mark — the rules are 530 units of horizontal ink, so a single
       broad blur of the whole silhouette just fills the bounding area.
       A tight halo carries the light and the wide pass, at half the
       opacity, carries only the falloff. */
    filter:drop-shadow(0 10px 22px rgba(6,8,14,.65))
           drop-shadow(0 0 13px rgba(245,145,60,.30))
           drop-shadow(0 0 48px rgba(245,145,60,.13));
  }
  #bootMark svg{display:block;width:100%;height:auto}
  /* Same travelling specular as the title card, same 7.5 s cadence, so
     a thirteen-second load still has something breathing in it. */
  #bootMark .bm-sheen{animation:bmSheen 7.5s cubic-bezier(.5,0,.5,1) 1.1s infinite}
  @keyframes bmSheen{
    0%  {transform:skewX(-16deg) translateX(0)}
    26% {transform:skewX(-16deg) translateX(1100px)}
    100%{transform:skewX(-16deg) translateX(1100px)}}

  /* DETERMINATE progress. The old bar was an indeterminate sweep, which
     said nothing — and boot is ~13 s, most of it in one stage, so "it is
     doing something" is not enough information. main.js drives #bootFill
     from measured per-stage weights. */
  #bootBar{
    margin:28px auto 0;width:240px;height:3px;border-radius:3px;
    background:rgba(255,255,255,.09);overflow:hidden;
    box-shadow:0 0 0 1px rgba(255,255,255,.04);
  }
  #bootFill{
    display:block;height:100%;width:0;border-radius:3px;
    background:linear-gradient(90deg,#d97a26,#f5913c 60%,#ffb567);
    box-shadow:0 0 12px rgba(245,145,60,.55);
    /* eased so the bar glides between stage boundaries instead of
       snapping; the duration is longer than a frame so a burst of quick
       stages still reads as motion */
    transition:width .45s cubic-bezier(.32,.72,.3,1);
    position:relative;
  }
  /* a travelling highlight, so a long stage still looks alive while the
     width is momentarily static */
  #bootFill::after{
    content:'';position:absolute;inset:0;border-radius:3px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
    animation:shimmer 1.4s ease-in-out infinite;
  }
  #bootStatus{
    margin-top:14px;display:flex;gap:12px;justify-content:center;
    align-items:baseline;width:240px;margin-left:auto;margin-right:auto;
    font:500 11px/1 ui-monospace,Menlo,monospace;
    letter-spacing:.28em;text-transform:uppercase;color:#5d6580;
  }
  #bootStage{flex:1;text-align:left;overflow:hidden;white-space:nowrap}
  #bootPct{color:#f5913c;font-variant-numeric:tabular-nums;letter-spacing:.1em}
  @keyframes shimmer{
    from{transform:translateX(-100%)}
    to{transform:translateX(100%)}
  }

  /* THE START BEAT. An AudioContext may only be resumed from a real
     user gesture, so the opening cinematic cannot simply auto-play
     with a score under it — it would play silent. This chip is that
     gesture, and it is the oldest convention in the medium: the
     original arcade title carried PRESS ANY KEY in exactly this box
     in the corner. main.js swaps the progress row for it the moment
     the last boot stage lands, and only when audio actually needs
     unlocking. */
  #bootGo{
    display:none;margin:26px auto 0;padding:12px 21px;
    font:500 11px/1 ui-monospace,Menlo,Consolas,monospace;
    letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;
    color:#f5913c;background:rgba(245,145,60,.07);
    border:1px solid rgba(245,145,60,.34);border-radius:9px;
    cursor:pointer;-webkit-appearance:none;appearance:none;
    animation:bootPulse 2.4s ease-in-out infinite;
  }
  #bootGo:hover,#bootGo:focus-visible{
    color:#ffb567;border-color:rgba(245,145,60,.62);
    background:rgba(245,145,60,.13);outline:none;
  }
  #boot.ask #bootBar,#boot.ask #bootStatus{display:none}
  #boot.ask #bootGo{display:inline-block}
  @keyframes bootPulse{
    0%,100%{opacity:.62;box-shadow:0 0 0 0 rgba(245,145,60,0)}
    50%    {opacity:1;box-shadow:0 0 22px 0 rgba(245,145,60,.18)}
  }

  @media (prefers-reduced-motion:reduce){
    #bootFill::after{animation:none;opacity:0}
    #bootFill{transition:none}
    #bootMark .bm-sheen{animation:none;opacity:0}
    #bootGo{animation:none;opacity:.9}
  }
</style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="ui"></div>
  <div id="overlay"></div>

  <div id="boot">
    <div id="bootInner">
      <div id="bootMark">
        <svg class="bm-mark" viewBox="0 0 640 196" role="img" aria-label="WALLY RPG" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bm-face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7efe0"/><stop offset="0.58" stop-color="#f7efe0"/><stop offset="1" stop-color="#f7c6a0"/></linearGradient>
          <linearGradient id="bm-sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.62"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <linearGradient id="bm-rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f5913c" stop-opacity="0"/><stop offset="1" stop-color="#f5913c" stop-opacity="0.95"/></linearGradient>
          <linearGradient id="bm-rule2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f5913c" stop-opacity="0.95"/><stop offset="1" stop-color="#f5913c" stop-opacity="0"/></linearGradient>
          <mask id="bm-mw" maskUnits="userSpaceOnUse" x="-40" y="-40" width="572" height="180"><g fill="#fff">
        <g transform="translate(0,0)"><path d="M0 0H26L46 64L64 20L82 64L102 0H128L90 100L64 58L38 100Z"/></g>
        <g transform="translate(114,0)"><path d="M43 0H69L26 100H0Z"/><path d="M43 0H69L112 100H86Z"/><path d="M22 56H90V78H22Z"/></g>
        <g transform="translate(234,0)"><path d="M0 0H26V74H78V100H0Z"/></g>
        <g transform="translate(328,0)"><path d="M0 0H26V74H78V100H0Z"/></g>
        <g transform="translate(396,0)"><path d="M0 0H26L61 50H35Z"/><path d="M70 0H96L61 50H35Z"/><path d="M35 46H61V100H35Z"/></g></g><g fill="#000">
        <g transform="translate(114,0)"><path d="M56 31L68 56H44Z"/></g></g><g fill="#fff"></g></mask>
          <mask id="bm-mp" maskUnits="userSpaceOnUse" x="-40" y="-40" width="572" height="180"><g fill="#fff">
        <g transform="translate(0,0)"><path d="M0 0H26L46 64L64 20L82 64L102 0H128L90 100L64 58L38 100Z"/></g>
        <g transform="translate(114,0)"><path d="M43 0H69L26 100H0Z"/><path d="M43 0H69L112 100H86Z"/><path d="M22 56H90V78H22Z"/></g>
        <g transform="translate(234,0)"><path d="M0 0H26V74H78V100H0Z"/></g>
        <g transform="translate(328,0)"><path d="M0 0H26V74H78V100H0Z"/></g>
        <g transform="translate(396,0)"><path d="M0 0H26L61 50H35Z"/><path d="M70 0H96L61 50H35Z"/><path d="M35 46H61V100H35Z"/></g></g><g fill="#000">
        <g transform="translate(114,0)"><path d="M56 31L68 56H44Z"/></g></g><g fill="#fff"></g></mask>
          <mask id="bm-mr" maskUnits="userSpaceOnUse" x="-40" y="-40" width="406" height="180"><g fill="#fff">
        <g transform="translate(0,0)"><path d="M0 0H26V100H0Z"/><path d="M13 0H56A31 31 0 0 1 56 62H13Z"/><path d="M40 50H68L100 100H72Z"/></g>
        <g transform="translate(114,0)"><path d="M0 0H26V100H0Z"/><path d="M13 0H56A31 31 0 0 1 56 62H13Z"/></g>
        <g transform="translate(214,0)"><ellipse cx="55" cy="50" rx="55" ry="50"/></g></g><g fill="#000">
        <g transform="translate(0,0)"><path d="M26 20H56A11 11 0 0 1 56 42H26Z"/></g>
        <g transform="translate(114,0)"><path d="M26 20H56A11 11 0 0 1 56 42H26Z"/></g>
        <g transform="translate(214,0)"><ellipse cx="55" cy="50" rx="29" ry="26"/><rect x="0" y="-11" width="96" height="22" transform="translate(55,50) rotate(-27)"/></g></g><g fill="#fff">
        <g transform="translate(214,0)"><rect x="50" y="39" width="58" height="22"/></g></g></mask>
        </defs>
        <g transform="translate(74,15) scale(1)"><g mask="url(#bm-mp)"><rect x="-40" y="-40" width="572" height="180" fill="#d96f1e"/></g></g>
        <g transform="translate(74,6) scale(1)"><g mask="url(#bm-mw)"><rect x="-40" y="-40" width="572" height="180" fill="url(#bm-face)"/><rect class="bm-sheen" x="-260" y="-60" width="120" height="230" fill="url(#bm-sheen)" transform="skewX(-16)"/></g></g>
        <rect class="bm-rule" x="54" y="147" width="191.10000000000002" height="3" fill="url(#bm-rule)"/>
        <rect class="bm-rule" x="394.90000000000003" y="147" width="191.09999999999997" height="3" fill="url(#bm-rule2)"/>
        <g transform="translate(271.1,132) scale(0.3)"><g mask="url(#bm-mr)"><rect x="-40" y="-40" width="406" height="180" fill="#f5913c"/></g></g></svg>
      </div>
      <div id="bootBar"><i id="bootFill"></i></div>
      <div id="bootStatus"><span id="bootStage">starting</span><span id="bootPct">0%</span></div>
      <button id="bootGo" type="button">Press any key to begin</button>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
