<!-- THE MARK, as a favicon. The die-cut sticker of Wally's head: light
     warm grey body, a heavy near-black outline (#0D2A26) with a white sticker
     halo outside it, two big rounded ears, a two-spike tuft, black wraparound
     sunglasses carrying the canon white rising-line glints
     (ref/wally-glint-canon.png), an ORANGE brow band across the top of the
     glasses, the trunk curling down to the viewer's left with three wrinkle
     lines, and one ivory tusk lower right.

     BUILT FOR 16 px FIRST. A browser tab gets 16 device pixels and the sticker
     has to survive them, so the glasses are deliberately oversized against the
     skull: the orange band is ~8 units of the 64 (two whole pixels at 16) and
     each glint is a 4.4-unit stroke, which is the smallest that still lands a
     near-white pixel rather than a grey smudge. Verified by rasterising at 16
     and looking, not by scaling the vector down and hoping. The ears, tuft,
     wrinkles and tusk are the detail that arrives at 32 px and up; at 16 the
     silhouette, the black lenses, the orange band and the two glints carry it.

     Inline, because the game has to run from file:// with no external assets.
     The apple-touch copy is the same geometry inset on the game's own dark
     plate — iOS composites transparency to black, which would eat the halo. -->

<title>WALLY RPG</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0d16}
  body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#f3eee5}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* ui layers are stacked above the canvas; each owns its own root */
  #ui{position:fixed;inset:0;pointer-events:none;z-index:10}
  #overlay{position:fixed;inset:0;pointer-events:none;z-index:20}

  #boot{
    position:fixed;inset:0;z-index:100;display:grid;place-items:center;
    background:#0a0d16;transition:opacity .5s ease;
    /* No double-tap-zoom delay on the one tap that unlocks the audio:
       mobile Chrome otherwise holds the synthesised click for ~300 ms,
       and the start beat is the tap the whole soundtrack hangs off. */
    touch-action:manipulation;
  }
  #boot.gone{opacity:0;pointer-events:none}
  #bootInner{text-align:center}

  /* THE MARK. Not type — the WALLY RPG lockup, drawn as outlines by
     src/intro/titlecard.js and inlined here verbatim (prefix 'bm', so
     its masks and gradients cannot collide with the intro card's
     'ic-' ones). The game ships no font files, so a text wordmark
     would be SF Pro here and DejaVu on a CI box; the one image people
     screenshot of this game has to be the same image everywhere.
     The boot mark and the title card are therefore literally the same
     geometry, thirty seconds apart. Regenerate by calling
     wordmarkSVG({ prefix:'bm', … }) from titlecard.js. */
  #bootMark{
    width:min(78vw,420px);margin:0 auto;
    /* Two-stage glow. One wide 44px pass made a lit rounded BOX, not a
       lit mark — the rules are 530 units of horizontal ink, so a single
       broad blur of the whole silhouette just fills the bounding area.
       A tight halo carries the light and the wide pass, at half the
       opacity, carries only the falloff. */
    filter:drop-shadow(0 10px 22px rgba(6,8,14,.65))
           drop-shadow(0 0 13px rgba(245,145,60,.30))
           drop-shadow(0 0 48px rgba(245,145,60,.13));
  }
  #bootMark svg{display:block;width:100%;height:auto}
  /* Same travelling specular as the title card, same 7.5 s cadence, so
     a thirteen-second load still has something breathing in it. */
  #bootMark .bm-sheen{animation:bmSheen 7.5s cubic-bezier(.5,0,.5,1) 1.1s infinite}
  @keyframes bmSheen{
    0%  {transform:skewX(-16deg) translateX(0)}
    26% {transform:skewX(-16deg) translateX(1100px)}
    100%{transform:skewX(-16deg) translateX(1100px)}}

  /* DETERMINATE progress. The old bar was an indeterminate sweep, which
     said nothing — and boot is ~13 s, most of it in one stage, so "it is
     doing something" is not enough information. main.js drives #bootFill
     from measured per-stage weights. */
  #bootBar{
    margin:28px auto 0;width:240px;height:3px;border-radius:3px;
    background:rgba(255,255,255,.09);overflow:hidden;
    box-shadow:0 0 0 1px rgba(255,255,255,.04);
  }
  #bootFill{
    display:block;height:100%;width:0;border-radius:3px;
    background:linear-gradient(90deg,#d97a26,#f5913c 60%,#ffb567);
    box-shadow:0 0 12px rgba(245,145,60,.55);
    /* eased so the bar glides between stage boundaries instead of
       snapping; the duration is longer than a frame so a burst of quick
       stages still reads as motion */
    transition:width .45s cubic-bezier(.32,.72,.3,1);
    position:relative;
  }
  /* a travelling highlight, so a long stage still looks alive while the
     width is momentarily static */
  #bootFill::after{
    content:'';position:absolute;inset:0;border-radius:3px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
    animation:shimmer 1.4s ease-in-out infinite;
  }
  #bootStatus{
    margin-top:14px;display:flex;gap:12px;justify-content:center;
    align-items:baseline;width:240px;margin-left:auto;margin-right:auto;
    font:500 11px/1 ui-monospace,Menlo,monospace;
    letter-spacing:.28em;text-transform:uppercase;color:#5d6580;
  }
  #bootStage{flex:1;text-align:left;overflow:hidden;white-space:nowrap}
  #bootPct{color:#f5913c;font-variant-numeric:tabular-nums;letter-spacing:.1em}
  @keyframes shimmer{
    from{transform:translateX(-100%)}
    to{transform:translateX(100%)}
  }

  /* THE START BEAT. An AudioContext may only be resumed from a real
     user gesture, so the opening cinematic cannot simply auto-play
     with a score under it — it would play silent. This chip is that
     gesture, and it is the oldest convention in the medium: the
     original arcade title carried PRESS ANY KEY in exactly this box
     in the corner. main.js swaps the progress row for it the moment
     the last boot stage lands, and only when audio actually needs
     unlocking. */
  #bootGo{
    display:none;margin:26px auto 0;padding:12px 21px;
    font:500 11px/1 ui-monospace,Menlo,Consolas,monospace;
    letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;
    color:#f5913c;background:rgba(245,145,60,.07);
    border:1px solid rgba(245,145,60,.34);border-radius:9px;
    cursor:pointer;-webkit-appearance:none;appearance:none;
    touch-action:manipulation;
    animation:bootPulse 2.4s ease-in-out infinite;
  }
  #bootGo:hover,#bootGo:focus-visible{
    color:#ffb567;border-color:rgba(245,145,60,.62);
    background:rgba(245,145,60,.13);outline:none;
  }
  #boot.ask #bootBar,#boot.ask #bootStatus{display:none}
  #boot.ask #bootGo{display:inline-block}
  @keyframes bootPulse{
    0%,100%{opacity:.62;box-shadow:0 0 0 0 rgba(245,145,60,0)}
    50%    {opacity:1;box-shadow:0 0 22px 0 rgba(245,145,60,.18)}
  }

  @media (prefers-reduced-motion:reduce){
    #bootFill::after{animation:none;opacity:0}
    #bootFill{transition:none}
    #bootMark .bm-sheen{animation:none;opacity:0}
    #bootGo{animation:none;opacity:.9}
  }
</style>
</head>
